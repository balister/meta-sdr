targets:
  main:
    resources:
      RemotePlace:
        name: beaglev-fire
    drivers:
      SerialDriver: {}
      USBPowerDriver:
        delay: 3.0
      USBStorageDriver: {}
      ShellDriver:
        prompt: 'root@[\w\-]+:[^ ]+ '
        login_prompt: ' login:'
        username: 'root'
        # HSS + U-Boot + kernel + systemd on the U54 cores is slow.
        login_timeout: 300
      BeagleVFireStrategy: {}
images:
  # bmaptool picks up images/image.wic.bmap automatically.
  emmc_image: images/image.wic.gz

imports:
 - BeagleVFireStrategy.py
