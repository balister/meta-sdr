targets:
  main:
    resources:
      RemotePlace:
        name: beaglev-fire
    drivers:
      SerialDriver: {}
      USBPowerDriver:
        delay: 3.0
      USBStorageDriver: {}
      ShellDriver:
        # With bash, systemd's profile.d/80-systemd-osc-context.sh puts OSC 3008
        # escape sequences in front of the prompt, so allow them before root@.
        prompt: '(?:\x1b\][^\x1b]*\x1b\\)*root@[\w\-]+:[^ ]+ '
        login_prompt: ' login:'
        username: 'root'
        # HSS + U-Boot + kernel + systemd on the U54 cores is slow.
        login_timeout: 300
      BeagleVFireStrategy: {}
images:
  # bmaptool picks up images/image.wic.bmap automatically.
  emmc_image: images/image.wic.gz

imports:
 - BeagleVFireStrategy.py
