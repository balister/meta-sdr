targets:
  main:
    resources:
      RemotePlace:
        name: pi5
    drivers:
      SerialDriver: {}
      NetworkPowerDriver:
        delay: 3.0
      USBStorageDriver: {}
      USBSDMuxDriver: {}
      ShellDriver:
        # With bash, systemd's profile.d/80-systemd-osc-context.sh puts OSC 3008
        # escape sequences in front of the prompt, so allow them before root@.
        prompt: '(?:\x1b\][^\x1b]*\x1b\\)*root@[\w\-]+:[^ ]+ '
        login_prompt: ' login:'
        username: 'root'
      PI5Strategy: {}
images:
  sd_image: images/image.wic.bz2

imports:
 - PI5Strategy.py


